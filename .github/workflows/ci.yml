# PrintFlow 2.0 CI (plan task 0.15)
#
# Two independent jobs, because they fail for different reasons and one
# should not mask the other:
#   database — migrations apply from zero, the schema verification suite proves
#              each §1 defect fix still holds, and the committed types match
#   core     — the shared packages typecheck and their tests pass
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Schema + verification suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Proves migrations apply from nothing -- the Stage 0 exit criterion.
      - name: Start local stack
        run: supabase start

      - name: Lint schema
        run: supabase db lint --level warning

      # Owns its own reset, so this is the whole gate.
      - name: Schema verification
        run: ./supabase/tests/run.sh

      # Committed types must match the migrations. Without this, a migration
      # can land with stale types and the compile-time contract silently
      # validates yesterday's schema.
      - name: Generated types are current
        run: |
          supabase gen types typescript --local > /tmp/types-check.ts
          if ! diff -u packages/db-types/src/database.types.ts /tmp/types-check.ts; then
            echo "::error::Generated types are stale. Run 'pnpm db:types' and commit the result."
            exit 1
          fi

      - name: Confirm migrations are reproducible from zero
        run: supabase db reset

  core:
    name: cost-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
